server:
  port: ${PORT:8080}

spring:
  application:
    name: finaudit-api
  main:
    allow-bean-definition-overriding: true
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 3000ms
        multiplier: 2.0
        max-interval: 35000ms
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          model: gemini-embedding-001
          options:
            model: gemini-embedding-001
            dimensions: 768
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-none} reportId=%X{reportId:-none}] - %msg%n"

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0

finaudit:
  security:
    jwt:
      secret: ${JWT_SECRET:default-secret-key-finaudit-ai-financial-auditor-must-be-at-least-256-bits-long}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:finaudit}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:finaudit}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:finaudit}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update

