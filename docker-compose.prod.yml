services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finaudit-postgres-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finaudit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finaudit"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finaudit-net

  api:
    build:
      context: .
      dockerfile: finaudit-api/Dockerfile
    container_name: finaudit-api-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finaudit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-9a7f5c2d4e8b1a3f6c9e2d5b8a1f4c7e0d3b6a9f2e5c8b1a4d7f0e3c6b9a2d5e}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finaudit-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finaudit-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finaudit-net

volumes:
  postgres-prod-data:
    driver: local

networks:
  finaudit-net:
    driver: bridge
