# Render Blueprint Specification for FinAudit-AI v1.0.2
# Automated zero-config deployment of PostgreSQL (with pgvector) and Spring Boot backend.
services:
  # 1. Backend Service (Spring Boot 3.4 + Java 21 Virtual Threads)
  - type: web
    name: finaudit-api
    runtime: docker
    dockerfilePath: ./finaudit-api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: finaudit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finaudit-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: finaudit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finaudit-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: finaudit-db
          property: database
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: JWT_SECRET
        generateValue: true

databases:
  # 2. PostgreSQL 16 with native pgvector extension
  - name: finaudit-db
    databaseName: finaudit
    plan: free
    region: singapore
    postgresMajorVersion: "16"
